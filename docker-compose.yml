# TTS backend for the render pipeline (design D12).
# Piper (GPL-3.0) stays in its own container; the port is bound to localhost only.
services:
  speaches:
    image: ghcr.io/speaches-ai/speaches:0.8.3-cpu
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SPEACHES_PORT:-8000}:8000"
    environment:
      # Required by Speaches for every request (including /health) when set.
      API_KEY: ${ANCHOR_TTS__API_KEY:?set ANCHOR_TTS__API_KEY (see docs/render-pipeline.md)}
      LOG_LEVEL: info
      ENABLE_UI: "false"
    volumes:
      - hf-hub-cache:/home/ubuntu/.cache/huggingface/hub
    healthcheck:
      test: ["CMD-SHELL", "curl --fail -H \"Authorization: Bearer $$API_KEY\" http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  hf-hub-cache:
